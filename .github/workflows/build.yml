name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    permissions:
      contents: read

    runs-on: ${{ matrix.os }}

    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Disable Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableBehaviorMonitoring $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableScriptScanning $true -ErrorAction SilentlyContinue
          Set-MpPreference -DisableIOAVProtection $true -ErrorAction SilentlyContinue
          Set-MpPreference -ExclusionPath @("${{ github.workspace }}", "C:\Users\runneradmin", "$env:TEMP", "$env:TMP") -ErrorAction SilentlyContinue

      # ── Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache standard ONNX model
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: models/standard_aesthetic_model.onnx
          key: onnx-${{ runner.os }}-${{ hashFiles('scripts/generate_standard_onnx.py') }}

      - name: Install PyTorch for ONNX export
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers onnx onnxscript

      - name: Export Standard ONNX Model
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: python scripts/generate_standard_onnx.py

      - name: Remove PyTorch after export
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pip uninstall -y torch transformers onnxscript || true
          pip cache purge || true

      - name: Install Python sidecar dependencies
        run: pip install -r requirements-build.txt

      - name: Cache Python sidecar
        id: cache-sidecar
        uses: actions/cache@v4
        with:
          path: tauri-frontend/dist-python
          key: sidecar-${{ runner.os }}-${{ hashFiles('src/app_api.py', 'src/burst_filter.py', 'src/model_manager.py', 'src/onnx_exporter.py', 'app_api.spec', 'requirements-build.txt') }}

      - name: Build Python sidecar (PyInstaller)
        if: steps.cache-sidecar.outputs.cache-hit != 'true'
        run: pyinstaller app_api.spec --distpath tauri-frontend/dist-python --noconfirm

      # ── Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tauri-frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: tauri-frontend
        run: npm ci

      # ── Rust ──────────────────────────────────────────────────────────
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Frontend
        working-directory: tauri-frontend
        run: npm run build

      # ── Tauri Build ───────────────────────────────────────────────────

      # macOS：dmg（portable）+ app（用于生成 pkg）
      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        working-directory: tauri-frontend
        run: npm run tauri build -- --bundles dmg,app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS PKG：用 productbuild 从 .app bundle 生成系统级安装器
      - name: Create macOS PKG Installer
        if: runner.os == 'macOS'
        run: |
          APP="tauri-frontend/src-tauri/target/release/bundle/macos/Imprint.app"
          productbuild --component "$APP" /Applications Imprint-macOS-Installer.pkg

      # Windows：构建二进制（跳过所有 Installer 压缩打包，覆盖 resources 避免在 build.rs 复制 15000+ 文件）
      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        working-directory: tauri-frontend
        run: npm run tauri build -- --no-bundle --config '{"bundle": {"resources": []}}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows Portable ZIP：exe + Python sidecar，解压即用
      # 运行时 lib.rs 会在 dist-python/ 下查找 sidecar，路径匹配
      # 使用 7z 多线程极速压缩，并排除 *.pdb 调试符号文件
      - name: Create Windows Portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "Imprint-Portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # 主程序
          if (Test-Path "tauri-frontend\src-tauri\target\release\imprint.exe") {
            Copy-Item "tauri-frontend\src-tauri\target\release\imprint.exe" "$out\Imprint.exe"
          } else {
            Copy-Item "tauri-frontend\src-tauri\target\release\tauri-frontend.exe" "$out\Imprint.exe"
          }
          # Python sidecar（保持目录结构）
          New-Item -ItemType Directory -Force -Path "$out\dist-python" | Out-Null
          if (Test-Path "tauri-frontend\dist-python\imprint_api") {
            Copy-Item -Recurse "tauri-frontend\dist-python\imprint_api" "$out\dist-python\imprint_api"
          }
          if (Test-Path "tauri-frontend\dist-python\photo_sort_api") {
            Copy-Item -Recurse "tauri-frontend\dist-python\photo_sort_api" "$out\dist-python\photo_sort_api"
          }
          # 清理调试符号
          Get-ChildItem -Path $out -Recurse -Filter "*.pdb" | Remove-Item -Force -ErrorAction SilentlyContinue
          # 使用 7-Zip 高速多线程压缩（避免 PowerShell Compress-Archive 单线程耗时 20+ 分钟）
          7z a -tzip -mx=4 "Imprint-Windows-Portable.zip" ".\$out\*"

      # ── Upload Artifacts (分平台精确上传) ───────────────────────────────
      - name: Upload macOS Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Imprint-macOS
          path: |
            tauri-frontend/src-tauri/target/release/bundle/dmg/*.dmg
            Imprint-macOS-Installer.pkg
          if-no-files-found: error

      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Imprint-Windows
          path: Imprint-Windows-Portable.zip
          if-no-files-found: error

  # ── 独立 Release 任务（避免多平台矩阵并发冲突导致死锁/重试循环）──────────────
  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
