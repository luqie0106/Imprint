name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    permissions:
      contents: write

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Disable Windows Defender (speed up build)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue

      # ── Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyTorch for ONNX export (temporary)
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers onnx onnxscript

      - name: Export Standard ONNX Model
        run: python scripts/generate_standard_onnx.py

      - name: Remove PyTorch to keep sidecar lean
        run: |
          pip uninstall -y torch transformers onnxscript || true
          pip cache purge || true

      - name: Install Python sidecar dependencies
        run: pip install -r requirements-build.txt

      - name: Build Python sidecar (PyInstaller)
        run: pyinstaller app_api.spec --distpath tauri-frontend/dist-python --noconfirm

      # ── Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tauri-frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: tauri-frontend
        run: npm ci

      # ── Rust ──────────────────────────────────────────────────────────
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-frontend/src-tauri -> target

      # ── Tauri Build ───────────────────────────────────────────────────
      - name: Build Tauri App
        working-directory: tauri-frontend
        run: npm run tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── macOS PKG Installer ───────────────────────────────────────────
      - name: Build macOS PKG Installer
        if: runner.os == 'macOS'
        run: |
          productbuild --component tauri-frontend/src-tauri/target/release/bundle/macos/PhotoSort.app /Applications PhotoSort_2.0.0_macOS_Installer.pkg

      # ── Upload Artifacts ──────────────────────────────────────────────
      - name: Upload macOS Packages
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSort-macOS
          path: |
            tauri-frontend/src-tauri/target/release/bundle/dmg/*.dmg
            *.pkg
          if-no-files-found: warn

      - name: Upload Windows Installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSort-Windows
          path: |
            tauri-frontend/src-tauri/target/release/bundle/msi/*.msi
            tauri-frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      # ── GitHub Release (tag push only) ────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            tauri-frontend/src-tauri/target/release/bundle/dmg/*.dmg
            *.pkg
            tauri-frontend/src-tauri/target/release/bundle/msi/*.msi
            tauri-frontend/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
