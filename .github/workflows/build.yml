name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    
    permissions:
      contents: write

    runs-on: ${{ matrix.os }}
    
    defaults:
      run:
        shell: bash

    env:
      PYTHONIOENCODING: utf-8
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyTorch and Transformers (for ONNX Export)
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers onnx onnxscript

      - name: Export ONNX Models
        run: |
          python scripts/generate_standard_onnx.py
          python -c "import os, sys, subprocess; subprocess.run([sys.executable, 'scripts/export_onnx.py']) if os.path.exists('models/aesthetic_mlp.pth') or os.path.exists('aesthetic_mlp.pth') else None" || true

      - name: Clean Heavy Dependencies
        run: |
          pip uninstall -y torch transformers
          pip cache purge || true

      - name: Install Build Dependencies (without PyTorch)
        run: |
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller photo_sort.spec

      # --- macOS 打包步骤 ---
      - name: Create Portable DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/dmg_staging
          cp -R dist/PhotoSort.app dist/dmg_staging/
          ln -s /Applications dist/dmg_staging/Applications
          hdiutil create -volname "PhotoSort" -srcfolder dist/dmg_staging -ov -format UDZO dist/PhotoSort-macOS-Portable.dmg
          rm -rf dist/dmg_staging

      - name: Create Installer PKG (macOS)
        if: runner.os == 'macOS'
        run: |
          productbuild --component dist/PhotoSort.app /Applications dist/PhotoSort-macOS-Installer.pkg

      # --- Windows 打包步骤 ---
      - name: Create Portable ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\PhotoSort -DestinationPath dist\PhotoSort-Windows-Portable.zip -Force

      - name: Create Windows Setup Installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -eq 'main' -or $version -eq 'master' -or [string]::IsNullOrWhiteSpace($version)) {
            $version = (Get-Content pyproject.toml | Select-String -Pattern 'version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          }
          & $iscc "/DMyAppVersion=$version" installer.iss


      # --- 上传构建产物 (便于 workflow_dispatch 手动运行时下载) ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSort-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.pkg
            dist/*.zip
            dist/*.exe
          if-no-files-found: warn

      # --- 发布 Release (在 Tag push 时触发) ---
      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.pkg
            dist/*.zip
            dist/*.exe
          fail_on_unmatched_files: false
          generate_release_notes: true

