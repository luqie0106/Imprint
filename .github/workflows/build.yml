name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    
    permissions:
      contents: write

    runs-on: ${{ matrix.os }}
    
    env:
      PYTHONIOENCODING: utf-8
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyTorch and Transformers (for ONNX Export)
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers onnx onnxscript

      - name: Export ONNX Model
        run: |
          python scripts/export_onnx.py

      - name: Clean Heavy Dependencies
        run: |
          pip uninstall -y torch transformers
          pip cache purge || true

      - name: Install Build Dependencies (without PyTorch)
        run: |
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller photo_sort.spec

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          npm install -g create-dmg || true
          create-dmg dist/PhotoSort.app dist/ 2>/dev/null || true
          mv *.dmg dist/PhotoSort-macOS.dmg 2>/dev/null || true
          if [ ! -f dist/PhotoSort-macOS.dmg ]; then
            echo "Using native hdiutil fallback to create DMG..."
            hdiutil create -volname PhotoSort -srcfolder dist/PhotoSort.app -ov -format UDZO dist/PhotoSort-macOS.dmg
          fi

      - name: Zip Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist\PhotoSort -DestinationPath dist\PhotoSort-Windows.zip -Force

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          generate_release_notes: true
