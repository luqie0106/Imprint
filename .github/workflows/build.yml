name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows

    permissions:
      contents: write

    runs-on: ${{ matrix.os }}

    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Disable Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue

      # ── Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache standard ONNX model
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: models/standard_aesthetic_model.onnx
          key: onnx-${{ runner.os }}-${{ hashFiles('scripts/generate_standard_onnx.py') }}

      - name: Install PyTorch for ONNX export
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers onnx onnxscript

      - name: Export Standard ONNX Model
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        run: python scripts/generate_standard_onnx.py

      - name: Remove PyTorch after export
        if: steps.cache-onnx.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pip uninstall -y torch transformers onnxscript || true
          pip cache purge || true

      - name: Install Python sidecar dependencies
        run: pip install -r requirements-build.txt

      - name: Cache Python sidecar
        id: cache-sidecar
        uses: actions/cache@v4
        with:
          path: tauri-frontend/dist-python
          key: sidecar-${{ runner.os }}-${{ hashFiles('src/app_api.py', 'src/burst_filter.py', 'src/model_manager.py', 'src/onnx_exporter.py', 'app_api.spec', 'requirements-build.txt') }}

      - name: Build Python sidecar (PyInstaller)
        if: steps.cache-sidecar.outputs.cache-hit != 'true'
        run: pyinstaller app_api.spec --distpath tauri-frontend/dist-python --noconfirm

      # ── Node.js ───────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tauri-frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: tauri-frontend
        run: npm ci

      # ── Rust ──────────────────────────────────────────────────────────
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-frontend/src-tauri -> target

      # ── Tauri Build ───────────────────────────────────────────────────

      # macOS：dmg（portable）+ app（用于生成 pkg）
      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        working-directory: tauri-frontend
        run: npm run tauri build -- --bundles dmg,app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # macOS PKG：用 productbuild 从 .app bundle 生成系统级安装器
      - name: Create macOS PKG Installer
        if: runner.os == 'macOS'
        run: |
          APP="tauri-frontend/src-tauri/target/release/bundle/macos/PhotoSort.app"
          productbuild --component "$APP" /Applications PhotoSort-macOS-Installer.pkg

      # Windows：构建二进制（跳过所有 Installer 压缩打包，直接生成 Portable ZIP 便携版）
      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        working-directory: tauri-frontend
        run: npm run tauri build -- --no-bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows Portable ZIP：exe + Python sidecar，解压即用
      # 运行时 lib.rs 会在 dist-python/photo_sort_api/ 下查找 sidecar，路径匹配
      # 依赖系统已安装 WebView2（Windows 10/11 默认预装）
      - name: Create Windows Portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "PhotoSort-Portable"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # 主程序（重命名为 PhotoSort.exe 方便用户识别）
          Copy-Item "tauri-frontend\src-tauri\target\release\tauri-frontend.exe" "$out\PhotoSort.exe"
          # Python sidecar（保持目录结构，与 lib.rs 搜索路径一致）
          New-Item -ItemType Directory -Force -Path "$out\dist-python" | Out-Null
          Copy-Item -Recurse "tauri-frontend\dist-python\photo_sort_api" "$out\dist-python\photo_sort_api"
          # 打包
          Compress-Archive -Path "$out\*" -DestinationPath "PhotoSort-Windows-Portable.zip" -Force

      # ── Upload Artifacts ──────────────────────────────────────────────
      - name: Upload macOS Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSort-macOS
          path: |
            tauri-frontend/src-tauri/target/release/bundle/dmg/*.dmg
            PhotoSort-macOS-Installer.pkg
          if-no-files-found: warn

      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSort-Windows
          path: |
            PhotoSort-Windows-Portable.zip
          if-no-files-found: warn

      # ── GitHub Release（仅 tag push 时触发）────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            tauri-frontend/src-tauri/target/release/bundle/dmg/*.dmg
            PhotoSort-macOS-Installer.pkg
            PhotoSort-Windows-Portable.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
