name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyTorch and Transformers (for ONNX Export)
        run: |
          python -m pip install --upgrade pip
          pip install torch transformers

      - name: Export ONNX Model
        run: |
          python scripts/export_onnx.py

      - name: Clean Heavy Dependencies
        run: |
          pip uninstall -y torch transformers
          pip cache purge || true

      - name: Install Build Dependencies (without PyTorch)
        run: |
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller photo_sort.spec

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          npm install -g create-dmg
          create-dmg dist/PhotoSort.app || true
          mv *.dmg dist/PhotoSort-macOS.dmg || true

      - name: Zip Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path dist\PhotoSort -DestinationPath dist\PhotoSort-Windows.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSort-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
