[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-sort"
version = "0.2.0"
description = "NEF 连拍优选工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0.0",
  "rawpy>=0.21.0",
  "opencv-python>=4.8.0",
  "numpy>=1.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "burst_filter", "burst_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
